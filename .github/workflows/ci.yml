name: CI

# Tests @nearpays/partner on every push and pull request, and publishes it to
# npm when a release tag (vX.Y.Z) is pushed. The steps are in RELEASING.md.
#
# Publishing uses npm trusted publishing (OIDC): no npm token is stored here.
# Link this repo and workflow file to the package once, on npmjs.com under
# the package's Settings → Trusted publishing.

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The source is TypeScript Node runs directly, so tests need Node 23.6+.
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm pack --dry-run

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  node20:
    # The published package promises Node 20: check the compiled output loads there.
    name: Loads on Node 20
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --omit=dev
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - run: |
          node --input-type=module -e "
            const sdk = await import('./dist/index.js');
            const { privateJwk } = await sdk.generateClientKeys('ci');
            await sdk.importClientKey(privateJwk);
            console.log('loads on', process.version);
          "

  publish:
    name: Publish to npm
    needs: [test, node20]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write # trusted publishing and provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs a recent npm CLI.
      - run: npm install -g npm@latest

      - name: The tag matches the package version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}" >&2
            exit 1
          fi

      - run: npm ci
      # prepublishOnly runs the tests and a clean build first.
      - run: npm publish
